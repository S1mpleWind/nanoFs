[project]
name = "nanocoder-labs"
version = "0.1.0"
description = "CSE 2026 course labs"
requires-python = ">=3.10"
dependencies = [
  "rich>=13",
  "prompt-toolkit>=3",
  "msgpack>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
